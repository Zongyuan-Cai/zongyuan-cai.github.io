<!doctype html>
<html lang="{{ page.lang | default: site.lang | escape }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  {% assign page_description = page.description | default: site.description %}
  <title>{{ page.title | escape }} · Zongyuan Cai</title>
  <meta name="description" content="{{ page_description | strip_html | normalize_whitespace | escape }}">
  <meta property="og:title" content="{{ page.title | escape }} · Zongyuan Cai">
  <meta property="og:description" content="{{ page_description | strip_html | normalize_whitespace | escape }}">
  <meta property="og:url" content="{{ page.url | absolute_url }}">
  <meta property="og:type" content="{% if page.layout == 'blog-post' %}article{% else %}website{% endif %}">
  <link rel="canonical" href="{{ page.url | absolute_url }}">
  <link rel="stylesheet" href="{{ '/assets/css/blog.css' | relative_url }}">
  <link rel="alternate" type="application/atom+xml" title="{{ site.title | escape }}" href="{{ '/blog/feed.xml' | relative_url }}">
</head>
<body>
  <a class="skip" href="#content">跳转至正文</a>
  <header class="site-header">
    <div class="container header-inner">
      <a class="site-name" href="{{ '/' | relative_url }}">Zongyuan Cai</a>
      <nav aria-label="主导航">
        <a href="{{ '/' | relative_url }}">主页</a>
        <a class="active" href="{{ '/blog/' | relative_url }}"{% if page.url == '/blog/' %} aria-current="page"{% endif %}>博客</a>
        <a href="https://github.com/Zongyuan-Cai">GitHub</a>
      </nav>
    </div>
  </header>
  <main class="container" id="content">
    {{ content }}
  </main>
  <footer class="container site-footer">
    <span>© {{ site.time | date: '%Y' }} Zongyuan Cai</span>
    <a href="{{ '/blog/feed.xml' | relative_url }}">订阅</a>
  </footer>
</body>
</html>
