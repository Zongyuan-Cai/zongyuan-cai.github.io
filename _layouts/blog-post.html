---
layout: blog
---
<article class="post">
  <header class="post-header">
    <p class="back-link"><a href="{{ '/blog/' | relative_url }}">← 全部文章</a></p>
    <h1>{{ page.title | escape }}</h1>
    <time class="post-date" datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: '%Y-%m-%d' }}</time>
  </header>
  <div class="post-content">
    {{ content }}
  </div>
  {% if page.previous or page.next %}
  <nav class="post-navigation" aria-label="相邻文章">
    {% if page.previous %}<a href="{{ page.previous.url | relative_url }}"><span>上一篇</span>{{ page.previous.title | escape }}</a>{% endif %}
    {% if page.next %}<a href="{{ page.next.url | relative_url }}"><span>下一篇</span>{{ page.next.title | escape }}</a>{% endif %}
  </nav>
  {% endif %}
</article>
